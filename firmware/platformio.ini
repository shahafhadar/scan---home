; ScanCart firmware for ESP32-S3.
;
; Three build targets share all the code and differ only in where the barcode
; comes from:
;
;   serial  nothing attached; barcodes typed into the monitor
;   uart    a serial scanner module (GM65 and friends)
;   usb     a USB-HID scanner, or the dongle of a wireless one
;
; Bring the board up on `serial` first. It proves WiFi, NTP, TLS, the request
; signature, the server and the offline queue without any scanner in the
; picture -- so if the usb build then misbehaves, the fault is in the USB
; stack and nowhere else. Debugging one unknown beats debugging two.

[env]
; One platform for every target.
;
; The USB host stack needs ESP-IDF 5, which the official PlatformIO platform
; does not ship -- but pointing only that target at a different platform does
; not work: both forks install into the same espressif32 directory and quietly
; overwrite each other, so building any two targets in sequence breaks the
; second one. Everything therefore builds against the same fork.
platform = https://github.com/pioarduino/platform-espressif32/archive/refs/tags/55.03.311.zip
board = esp32-s3-devkitc-1
framework = arduino

; The stock board definition assumes 8MB of flash. The N16R8 has 16MB, and the
; partition table below runs past the 8MB mark -- which the bootloader rejects
; outright, resetting every 24ms before a single line of our code executes.
; Nothing in the failure points at flash size, so state it explicitly.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
monitor_speed = 115200
board_build.filesystem = littlefs
; 16MB part table: two OTA slots plus a filesystem for the offline queue.
board_build.partitions = partitions.csv
build_flags =
    -DCORE_DEBUG_LEVEL=2
    ; Includes are written from the source root -- "platform/Log.h", not
    ; "../platform/Log.h" -- so a file says where its dependency lives and
    ; moving one file does not rewrite the includes of its neighbours.
    -I src
lib_deps =
    bblanchon/ArduinoJson@^7.2.1

; The DevKitC-1 has two USB-C sockets. The one marked UART is the programmer;
; the one marked USB is the chip's own port. Which one carries the serial
; monitor depends on the build, and getting this wrong looks like a dead board.

[env:serial]
; Monitor over the USB socket, so one cable does everything.
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1

[env:uart]
build_flags = ${env.build_flags} -DSCANNER_UART=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:usb]
; The USB socket now belongs to the scanner, so the monitor has to come out of
; the UART socket instead. Without this the port is claimed twice and the
; serial output simply never appears.
; SCANNER_BLE: a Bluetooth LE scanner alongside the dongle, in the same image
; (scan/BleScanner.h). The S3 has no Bluetooth Classic, so only BLE scanners.
build_flags = ${env.build_flags} -DSCANNER_USB_HID=1 -DSCANNER_BLE=1 -DARDUINO_USB_CDC_ON_BOOT=0
; ARDUINO_USB_MODE=0 hands the USB pins to the OTG controller. The board
; definition sets it to 1, which routes them to the fixed-function Serial/JTAG
; peripheral -- the two share one PHY on the S3, and host mode needs the OTG
; side. The board's flags are applied after build_flags, so this has to replace
; the list rather than append to it.
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_MODE=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
; Only this target has any use for a USB host stack. Building it into the
; others cost a hundred seconds per compile and broke builds that never
; touched USB.
lib_deps =
    ${env.lib_deps}
    https://github.com/tanakamasayuki/EspUsbHost.git
    ; Same pin as the blescan diagnostic, which is where this version was
    ; proven on the board (1.4.x panics at init on this core).
    h2zero/NimBLE-Arduino@^2.5.2

; Diagnostic only, not part of the product. Answers: is the scanner on the air
; over BLE, and which protocol does it speak there (HID keyboard reports, or a
; vendor "serial" characteristic)? Output comes out of the UART/COM socket, the
; same one the product builds log to.
[env:blescan]
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=0
build_src_filter = -<*> +<../tools/blescan/main.cpp>
; 2.x, not 1.4: 1.4.3 still compiles against this core (Arduino 3 / IDF 5.5)
; but its controller config no longer matches, and the board panics inside
; esp_bt_controller_init on the first boot.
lib_deps =
    h2zero/NimBLE-Arduino@^2.5.2

; What actually ships. Same code as `usb`, with the guards switched on:
;
;   - the host must be https, checked at compile time rather than warned about
;     at boot on a device nobody is watching
;   - logging starts at Warn, because debug output costs CPU and serial
;     bandwidth for an audience of nobody
;
; Building this while firmware/src/local_config.h still points at a laptop is
; a compile error, which is the intent. That file is how a development host
; would otherwise reach a shipped device.
[env:production]
extends = env:usb
build_flags = ${env:usb.build_flags} -DSCANCART_PRODUCTION=1

; Proves the update safety net; never shipped. The same image as `usb`, except
; that it never completes a heartbeat -- so after an update it can never pass
; probation, and the board has to roll itself back, report the version as
; rejected, and not install it again. Carries its own version (config.h).
; See docs/firmware-ota.md.
[env:otatest]
extends = env:usb
build_flags = ${env:usb.build_flags} -DSCANCART_OTA_ROLLBACK_TEST=1

; The check a person runs on a board before it is packed. Not the product:
; the product's own self-test runs at boot and covers what software can decide
; alone, and this covers what it cannot -- whether the buzzer is audible and
; whether the LED is the colour it claims. Those steps ask and wait.
[env:factorytest]
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<../tools/factorytest/main.cpp>
